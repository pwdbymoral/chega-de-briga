<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2447e8" />
    <meta name="description" content="Combinados mais claros para quem divide a casa." />
    <link rel="icon" type="image/svg+xml" href="/simbolo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        const saved = localStorage.getItem("cdb-theme");
        document.documentElement.dataset.theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <title>Chega de Briga</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    # Keep the old landing domain usable while consolidating search URLs.
    if ($host ~* ^(www\.)?chega-de-briga\.forjacorp\.com$) {
        return 301 https://chegadebriga.forjacorp.com$request_uri;
    }
    if ($host = www.chegadebriga.forjacorp.com) {
        return 301 https://chegadebriga.forjacorp.com$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

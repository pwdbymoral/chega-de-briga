services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chegadebriga
      POSTGRES_USER: chegadebriga
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  local_postgres_data:
    name: chega_de_briga_local_dev_data
